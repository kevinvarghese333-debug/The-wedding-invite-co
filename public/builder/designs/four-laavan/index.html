<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding invitation</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a1035">
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalnia:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Noto+Serif+Gurmukhi:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/sky.webp">
<link rel="preload" as="image" href="assets/palace.webp">
<link rel="stylesheet" href="css/style.css">
<script>history.scrollRestoration = 'manual'; document.documentElement.classList.add('js'); if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('reduced');</script>
</head>
<body>

<button class="music" id="music" type="button" aria-label="Play music" aria-pressed="false" hidden><i></i><i></i><i></i></button>

<main>

  <!-- 1. The four laavan. Each scroll-step draws one ring of gold thread around the names;
          after the fourth, the camera drops through the sunset to the palace and the lanterns lift away. -->
  <section class="laav" id="laav" aria-label="Invitation">
    <div class="laav__pin" id="pin">
      <div class="scene" id="scene" aria-hidden="true">
        <img class="sky" id="sky" src="assets/sky.webp" alt="" decoding="async">
        <i class="sun" id="sun"></i>
        <canvas class="drift" id="drift"></canvas>
        <img class="palace" id="palace" src="assets/palace.webp" alt="" decoding="async">
        <img class="bush bush--l" src="assets/foliage.webp" alt="" decoding="async">
        <img class="bush bush--r" src="assets/foliage.webp" alt="" decoding="async">
      </div>

      <svg class="vows" id="vows" aria-hidden="true"></svg>

      <div class="words" id="words">
        <p class="words__to" id="to" hidden></p>
        <h1 class="names" id="names">
          <span class="nm" data-split="one"></span>
          <span class="nm nm--and" data-split="joiner"></span>
          <span class="nm" data-split="two"></span>
        </h1>
        <p class="words__tag" id="tag" data-t="tagline"></p>
      </div>

      <div class="round" id="round" aria-live="polite">
        <p class="round__gm" id="roundGm" lang="pa"></p>
        <p class="round__en" id="roundEn"></p>
        <p class="round__mean" id="roundMean"></p>
        <ol class="round__beads" id="roundBeads" aria-hidden="true"><li></li><li></li><li></li><li></li></ol>
      </div>

      <div class="near" id="near" aria-hidden="true"></div>
      <p class="cue" id="cue"><span data-t="laavan.cue"></span><i></i></p>
    </div>
  </section>

  <!-- 2. Ik Onkar, families and names on purple ornament -->
  <section class="panel panel--plum" id="blessing">
    <svg class="scallop" viewBox="0 0 120 10" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10V6C5 6 5 0 10 0S15 6 20 6S25 0 30 0S35 6 40 6S45 0 50 0S55 6 60 6S65 0 70 0S75 6 80 6S85 0 90 0S95 6 100 6S105 0 110 0S115 6 120 6V10Z"/></svg>
    <svg class="vine vine--l" viewBox="0 0 40 600" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M20 0C4 40 36 80 20 120S4 200 20 240S36 320 20 360S4 440 20 480S36 560 20 600"/><path pathLength="1" class="vine__leaf" d="M20 60c8-6 14-4 16 2M20 180c-8-6-14-4-16 2M20 300c8-6 14-4 16 2M20 420c-8-6-14-4-16 2M20 540c8-6 14-4 16 2"/></svg>
    <svg class="vine vine--r" viewBox="0 0 40 600" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M20 0C36 40 4 80 20 120S36 200 20 240S4 320 20 360S36 440 20 480S4 560 20 600"/><path pathLength="1" class="vine__leaf" d="M20 60c-8-6-14-4-16 2M20 180c8-6 14-4 16 2M20 300c-8-6-14-4-16 2M20 420c8-6 14-4 16 2M20 540c-8-6-14-4-16 2"/></svg>
    <div class="wrap wrap--narrow blessing">
      <div class="onkar" id="onkar">
        <svg class="onkar__ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle pathLength="1" cx="100" cy="100" r="92"/>
          <circle pathLength="1" cx="100" cy="100" r="84" class="thin"/>
          <g class="petals"></g>
        </svg>
        <p class="onkar__glyph" lang="pa" data-t="b.invocation"></p>
      </div>
      <p class="mool" data-rise lang="pa" data-t="b.mool"></p>
      <svg class="flourish" data-draw viewBox="0 0 240 24" aria-hidden="true"><path pathLength="1" d="M4 12H90M150 12H236M96 12C104 2 114 4 120 12C126 20 136 22 144 12M120 12C112 20 102 20 96 12M120 12C128 4 138 2 144 12"/></svg>
      <p class="line" data-rise data-t="b.line"></p>
      <p class="line line--name" data-rise data-t="b.elders"></p>
      <p class="line line--sm" data-rise>&amp;</p>
      <p class="line line--name" data-rise data-t="b.hosts"></p>
      <p class="line" data-rise data-t="b.request"></p>
      <h2 class="bigname" data-split="oneFull"></h2>
      <p class="line line--sm" data-rise data-t="p.label"></p>
      <h2 class="bigname" data-split="twoFull"></h2>
      <p class="line" data-rise data-t="p.note"></p>
      <p class="line line--name" data-rise data-t="p.parents"></p>
      <svg class="flourish" data-draw viewBox="0 0 240 24" aria-hidden="true"><path pathLength="1" d="M4 12H90M150 12H236M96 12C104 2 114 4 120 12C126 20 136 22 144 12M120 12C112 20 102 20 96 12M120 12C128 4 138 2 144 12"/></svg>
    </div>
  </section>

  <!-- 3. Events in gold woven oval frames, each with a lantern swinging above it -->
  <section class="panel panel--plum2" id="events">
    <div class="wrap">
      <h2 class="title" data-rise data-t="p.next"></h2>
      <ul class="cards" id="cards"></ul>
    </div>
    <div class="venue">
      <h2 class="title" data-lines="venue.title" data-rise></h2>
      <p class="venue__name" data-rise data-t="venue.name"></p>
      <p class="note" data-rise data-t="venue.place"></p>
      <a class="seal" id="venueSeal" target="_blank" rel="noopener" aria-label="Open the venue on the map" data-rise>
        <svg class="seal__ring" viewBox="0 0 200 200" aria-hidden="true"><defs><path id="ringPath1" d="M100 100 m-78 0 a78 78 0 1 1 156 0 a78 78 0 1 1 -156 0"/></defs><text><textPath href="#ringPath1">SEE THE ROUTE · SEE THE ROUTE · SEE THE ROUTE · </textPath></text></svg>
        <svg class="seal__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.3 7-11.5A7 7 0 0 0 5 9.5C5 14.7 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
      </a>
      <p class="note" data-rise data-t="venue.note"></p>
    </div>
  </section>

  <!-- 4. Meet the couple on turquoise; the palla (scarf) thread runs from his hand to hers as you scroll -->
  <section class="panel panel--teal" id="meet">
    <svg class="scallop scallop--teal" viewBox="0 0 120 10" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10V6C5 6 5 0 10 0S15 6 20 6S25 0 30 0S35 6 40 6S45 0 50 0S55 6 60 6S65 0 70 0S75 6 80 6S85 0 90 0S95 6 100 6S105 0 110 0S115 6 120 6V10Z"/></svg>
    <div class="meet">
      <div class="meet__text wrap--narrow">
        <p class="kicker" data-rise data-t="meet.kicker"></p>
        <h2 class="title title--big" data-rise data-lines="meet.title"></h2>
        <p class="body" data-rise data-t="meet.note"></p>
      </div>
      <figure class="portrait" id="portrait">
        <svg class="portrait__arch" viewBox="0 0 100 150" preserveAspectRatio="none" aria-hidden="true">
          <path pathLength="1" d="M4 150V58C4 28 24 6 50 3C76 6 96 28 96 58V150"/>
          <path pathLength="1" class="stitch" d="M10 150V60C10 33 28 13 50 10C72 13 90 33 90 60V150"/>
        </svg>
        <i class="portrait__glow"></i>
        <img src="assets/couple.webp" alt="__WIC_ONE__ and __WIC_TWO__ in wedding clothes, holding the palla between them" loading="lazy">
      </figure>
    </div>
  </section>

  <!-- 5. Gallery -->
  <section class="panel panel--teal2" id="gallery">
    <div class="wrap">
      <p class="kicker" data-rise data-t="gallery.kicker"></p>
      <h2 class="title" data-rise data-lines="gallery.title"></h2>
    </div>
    <div class="slider" id="slider" aria-roledescription="carousel" aria-label="Photos of the couple">
      <ul class="slides" id="slides"></ul>
      <div class="slider__ctrl">
        <button class="arrow" id="prev" type="button" aria-label="Previous photo"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="dots" id="dots" role="tablist"></div>
        <button class="arrow" id="next" type="button" aria-label="Next photo"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
  </section>

  <!-- 6. RSVP inside an ornamental medallion that draws itself -->
  <section class="panel panel--plum panel--rsvp" id="rsvp">
    <div class="medal" id="medal">
      <svg class="medal__line" viewBox="0 0 300 300" aria-hidden="true">
        <circle pathLength="1" cx="150" cy="150" r="140"/>
        <circle pathLength="1" cx="150" cy="150" r="128" class="dots"/>
        <g class="medal__petals"></g>
      </svg>
      <div class="medal__in">
        <h2 class="title title--big" data-rise data-lines="rsvp.title"></h2>
        <a class="seal seal--light" id="rsvpSeal" target="_blank" rel="noopener" aria-label="Reply on WhatsApp" data-rise>
          <svg class="seal__ring" viewBox="0 0 200 200" aria-hidden="true"><defs><path id="ringPath2" d="M100 100 m-78 0 a78 78 0 1 1 156 0 a78 78 0 1 1 -156 0"/></defs><text><textPath href="#ringPath2" data-t="rsvp.ring"></textPath></text></svg>
          <svg class="seal__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-4.1A8 8 0 1 1 8.3 19L4 20Z"/><path d="M9 9.2c.3 2.7 2.8 5.3 5.7 5.8l1.2-1.5-1.9-1.1-.9.8c-.9-.4-1.7-1.2-2.1-2.1l.8-.9L10.7 8 9 9.2Z"/></svg>
        </a>
        <p class="note" data-rise data-t="rsvp.note"></p>
      </div>
    </div>
  </section>

  <!-- 7. Good to know, on a sunset peach -->
  <section class="panel panel--peach" id="know">
    <div class="wrap">
      <h2 class="title" data-rise data-lines="know.title"></h2>
      <p class="body body--center" data-rise data-t="know.note"></p>
      <ul class="know" id="knowList"></ul>
    </div>
  </section>

  <!-- 8. Follow: a great moon rises over purple ornament -->
  <section class="panel panel--plum panel--moon" id="follow">
    <div class="wrap wrap--narrow">
      <h2 class="title" data-rise data-lines="follow.title"></h2>
      <p class="note" data-rise data-t="follow.note"></p>
    </div>
    <div class="moon" id="moon">
      <i class="moon__halo" aria-hidden="true"></i>
      <img src="assets/moon.webp" alt="A full moon with a garland of jasmine" loading="lazy">
      <a class="seal seal--small" id="followSeal" target="_blank" rel="noopener" aria-label="Open Instagram">
        <svg class="seal__ring" viewBox="0 0 200 200" aria-hidden="true"><defs><path id="ringPath3" d="M100 100 m-78 0 a78 78 0 1 1 156 0 a78 78 0 1 1 -156 0"/></defs><text><textPath href="#ringPath3" data-t="follow.ring"></textPath></text></svg>
        <svg class="seal__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.7"/><circle cx="16.7" cy="7.3" r=".6"/></svg>
      </a>
    </div>
  </section>

  <!-- 9. Dusk over the palace; four rings close around the countdown -->
  <section class="finale" id="finale">
    <div class="finale__pin" id="finPin">
      <div class="scene scene--dusk" aria-hidden="true">
        <img class="sky" src="assets/sky.webp" alt="" loading="lazy">
        <canvas class="drift" id="drift2"></canvas>
        <img class="palace" id="palace2" src="assets/palace.webp" alt="" loading="lazy">
        <img class="bush bush--l" src="assets/foliage.webp" alt="" loading="lazy">
        <img class="bush bush--r" src="assets/foliage.webp" alt="" loading="lazy">
      </div>
      <svg class="vows vows--end" id="vows2" aria-hidden="true"></svg>
      <div class="count" id="count">
        <h2 class="count__title" data-t="count.title"></h2>
        <p class="count__clock" id="clock" role="timer" aria-live="off"></p>
        <p class="count__sign" data-t="signoff"></p>
      </div>
    </div>
  </section>

</main>

<footer class="foot">
  <a class="foot__credit" href="https://www.instagram.com/the.weddinginviteco/" target="_blank" rel="noopener">
    <img src="assets/twic-seal.png" alt="" width="52" height="52" loading="lazy">
    <span>Made with love by The Wedding Invite Co.</span>
  </a>
</footer>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-tag" viewBox="0 0 48 48"><path pathLength="1" d="M18 6 14 42M34 6 30 42M7 17h36M5 31h36"/></symbol>
  <symbol id="i-sun" viewBox="0 0 48 48"><path pathLength="1" d="M24 15.5a8.5 8.5 0 1 1 0 17a8.5 8.5 0 1 1 0-17M24 5v5M24 38v5M5 24h5M38 24h5M10.6 10.6l3.5 3.5M33.9 33.9l3.5 3.5M10.6 37.4l3.5-3.5M33.9 14.1l3.5-3.5"/></symbol>
  <symbol id="i-person" viewBox="0 0 48 48"><path pathLength="1" d="M24 6.5a5.5 5.5 0 1 1 0 11a5.5 5.5 0 1 1 0-11M15 42V26a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v16M20 42V32M28 42V32"/></symbol>
  <symbol id="i-car" viewBox="0 0 48 48"><path pathLength="1" d="M8 36V26l4-11c.6-1.6 1.8-2.5 3.4-2.5h17.2c1.6 0 2.8.9 3.4 2.5l4 11v10ZM8 26h32M12 36v4M36 36v4M13 31h4M31 31h4"/></symbol>
</defs></svg>

<script src="js/vendor/gsap.min.js"></script>
<script src="js/vendor/ScrollTrigger.min.js"></script>
<script src="js/vendor/lenis.min.js"></script>
<script src="js/config.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
</body>
</html>
