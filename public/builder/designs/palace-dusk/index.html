<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veer weds Naina</title>
<meta name="description" content="You are invited to the wedding of Veer and Naina. Scroll to take the drive.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#20306e">
<meta property="og:title" content="Veer weds Naina">
<meta property="og:description" content="You are invited. Scroll to take the drive.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://veer-naina.vercel.app/assets/og.jpg">
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;1,400&family=Barlow+Condensed:wght@600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/sky-dusk.webp">
<link rel="preload" as="image" href="assets/palace-dusk.webp">
<link rel="preload" as="image" href="assets/car-rear.webp">
<link rel="stylesheet" href="css/style.css">
<script>history.scrollRestoration = 'manual'; document.documentElement.classList.add('js'); if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('reduced');</script>
</head>
<body>

<div class="probe" aria-hidden="true"></div>
<button class="music" id="music" type="button" aria-label="Play music" aria-pressed="false" hidden></button>

<main>

  <!-- 1. Sunset. The car drives up the road to the palace gate. -->
  <section class="stage stage--drive" id="hero" aria-label="Invitation">
    <div class="pin">
      <div class="scene" data-time="dusk">
        <div class="sky"></div>
        <canvas class="ground" aria-hidden="true"></canvas>
        <img class="palace" src="assets/palace-dusk.webp" alt="" decoding="async">
        <div class="flare" aria-hidden="true"></div>
        <div class="lanterns" aria-hidden="true"></div>
        <div class="car car--rear" role="img" aria-label="A vintage green car carrying the bride and groom">
          <i class="car__shadow"></i>
          <div class="car__body">
            <img src="assets/car-rear.webp" alt="" decoding="async">
            <span class="plate plate--rear" data-plate></span>
            <i class="lamp lamp--tail lamp--l"></i><i class="lamp lamp--tail lamp--r"></i>
          </div>
          <i class="puff"></i><i class="puff"></i><i class="puff"></i>
        </div>
      </div>
      <div class="hero__words">
        <p class="hero__to" id="heroTo" hidden></p>
        <h1 class="hero__names">
          <span class="hero__name" data-t="one"></span>
          <span class="hero__weds" data-t="joiner"></span>
          <span class="hero__name" data-t="two"></span>
        </h1>
      </div>
      <p class="cue" id="cue"><span>Scroll to drive</span><i></i></p>
    </div>
  </section>

  <!-- 2. Blessings, names, events -->
  <section class="panel panel--first" id="blessing">
    <div class="wrap wrap--center">
      <p class="invocation" data-rise data-t="invocation" lang="sa"></p>
      <img class="ganesha" data-rise src="assets/ganesha.webp" alt="Lord Ganesha" loading="lazy" width="282" height="420">
      <p class="script" data-rise data-t="b.line"></p>
      <p class="script" data-rise data-t="b.elders"></p>
      <i class="rule" data-rise></i>
      <p class="script" data-rise data-t="b.hosts"></p>
      <p class="script script--sm" data-rise data-t="b.request"></p>
    </div>
    <div class="wrap wrap--center names">
      <h2 class="names__big" data-rise data-t="one"></h2>
      <p class="names__and" data-rise>&amp;</p>
      <h2 class="names__big" data-rise data-t="two"></h2>
      <p class="script" data-rise data-t="p.label"></p>
      <p class="script" data-rise data-t="p.parents"></p>
      <p class="script names__next" data-rise data-t="p.next"></p>
    </div>
    <div class="wrap">
      <ul class="events" id="events"></ul>
    </div>
  </section>

  <!-- 3. Side on: the wheels turn with your scroll, along the line where two colours meet -->
  <section class="stage stage--route" id="route">
    <div class="pin panel panel--first">
      <div class="wrap wrap--center route__words">
        <h2 class="title" data-lines="route.title"></h2>
        <p class="note" data-t="route.note"></p>
        <a class="ring" id="routeRing" target="_blank" rel="noopener" aria-label="Open the map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.3 7-11.5A7 7 0 0 0 5 9.5C5 14.7 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/></svg></a>
      </div>
      <div class="kerb panel--second" aria-hidden="true"></div>
      <i class="trail" aria-hidden="true"></i>
      <div class="car car--side" role="img" aria-label="The car driving past with the couple inside">
        <i class="car__shadow"></i>
        <div class="car__body">
          <img src="assets/car-side.webp" alt="" loading="lazy" decoding="async">
          <div class="wheel wheel--r"><img src="assets/wheel-r.webp" alt=""><img class="wheel__blur" src="assets/wheel-r-blur.webp" alt=""></div>
          <div class="wheel wheel--f"><img src="assets/wheel-f.webp" alt=""><img class="wheel__blur" src="assets/wheel-f-blur.webp" alt=""></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 4. The couple -->
  <section class="panel panel--second" id="meet">
    <div class="wrap wrap--center">
      <p class="kicker" data-rise data-t="meet.kicker"></p>
      <h2 class="title" data-rise data-lines="meet.title"></h2>
      <p class="body" data-rise data-t="meet.note"></p>
      <figure class="portrait" data-rise>
        <img class="portrait__photo" id="couplePhoto" alt="" loading="lazy">
        <img class="portrait__frame" src="assets/frame.webp" alt="" loading="lazy">
      </figure>
    </div>
  </section>

  <!-- 5. Head on: the car comes at you and stops on the next colour -->
  <section class="stage stage--rsvp" id="rsvp">
    <div class="pin panel panel--second">
      <div class="wrap wrap--center rsvp__words">
        <h2 class="title" data-lines="rsvp.title"></h2>
        <p class="note" data-t="rsvp.note"></p>
        <a class="ring" id="rsvpRing" target="_blank" rel="noopener" aria-label="Reply on WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-4.1A8 8 0 1 1 8.3 19L4 20Z"/><path d="M9 9.2c.3 2.7 2.8 5.3 5.7 5.8l1.2-1.5-1.9-1.1-.9.8c-.9-.4-1.7-1.2-2.1-2.1l.8-.9L10.7 8 9 9.2Z"/></svg></a>
      </div>
      <div class="kerb panel--third" aria-hidden="true"></div>
      <div class="car car--front" role="img" aria-label="The car driving towards you">
        <i class="car__shadow"></i>
        <div class="car__body">
          <img src="assets/car-front.webp" alt="" loading="lazy" decoding="async">
          <span class="plate plate--front" data-plate></span>
          <i class="lamp lamp--head lamp--l"></i><i class="lamp lamp--head lamp--r"></i>
        </div>
      </div>
    </div>
  </section>

  <!-- 6. Things to know -->
  <section class="panel panel--third" id="know">
    <div class="wrap wrap--center">
      <h2 class="title" data-rise data-lines="know.title"></h2>
      <p class="body" data-rise data-t="know.note"></p>
      <ul class="know" id="knowList"></ul>
      <h2 class="title follow" data-rise data-lines="follow.title"></h2>
      <p class="note" data-rise data-t="follow.note"></p>
      <a class="ring" id="followRing" data-rise target="_blank" rel="noopener" aria-label="Open Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.7"/><circle cx="16.7" cy="7.3" r=".6"/></svg></a>
    </div>
  </section>

  <!-- 7. Night. The car comes home with its lights on. -->
  <section class="stage stage--home" id="finale">
    <div class="pin">
      <div class="scene" data-time="night">
        <div class="sky"></div>
        <canvas class="ground" aria-hidden="true"></canvas>
        <img class="palace" src="assets/palace-night.webp" alt="" loading="lazy" decoding="async">
        <div class="lanterns" aria-hidden="true"></div>
        <i class="pool" aria-hidden="true"></i>
        <div class="car car--night" role="img" aria-label="The car arriving at night with its headlights on">
          <i class="car__shadow"></i>
          <div class="car__body">
            <img src="assets/car-front.webp" alt="" loading="lazy" decoding="async">
            
            <span class="plate plate--front" data-plate></span>
            <i class="lamp lamp--beam lamp--l"></i><i class="lamp lamp--beam lamp--r"></i>
          </div>
        </div>
      </div>
      <div class="count" id="count">
        <h2 class="count__title" data-t="count.title"></h2>
        <p class="count__clock" id="clock" role="timer" aria-live="off"></p>
      </div>
    </div>
  </section>

</main>

<footer class="foot">
  <p class="script" data-t="signoff"></p>
  <img class="foot__seal" src="assets/twic-seal.png" alt="The Wedding Invite Co." loading="lazy" width="56" height="56">
</footer>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-tag" viewBox="0 0 48 48"><rect x="8" y="8" width="32" height="32" rx="9"/><circle cx="24" cy="24" r="8"/><circle cx="33.5" cy="14.5" r="1.4"/></symbol>
  <symbol id="i-sun" viewBox="0 0 48 48"><circle cx="24" cy="24" r="8.5"/><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/></symbol>
  <symbol id="i-person" viewBox="0 0 48 48"><circle cx="24" cy="12" r="5.5"/><path d="M15 24a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v9h-4v9h-10v-9h-4Z"/></symbol>
  <symbol id="i-car" viewBox="0 0 48 48"><path d="M8 37v-11l4-12c.5-1.5 1.7-2.5 3.3-2.5h17.4c1.6 0 2.8 1 3.3 2.5l4 12v11Z"/><path d="M8 26h32"/><circle cx="15" cy="31.5" r="2.3"/><circle cx="33" cy="31.5" r="2.3"/><path d="M12 37v3M36 37v3"/></symbol>
</defs></svg>

<script src="js/vendor/gsap.min.js"></script>
<script src="js/vendor/ScrollTrigger.min.js"></script>
<script src="js/vendor/lenis.min.js"></script>
<script src="js/config.js"></script>
<script src="js/ground.js"></script>
<script src="js/main.js"></script>
</body>
</html>
